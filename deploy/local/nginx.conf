server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://backend:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://backend:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # AudioWorklet / ES modules. nginx's bundled mime.types only maps .js,
    # so .mjs falls back to application/octet-stream and the browser refuses
    # to load it as a worklet module.
    location ~ \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    location ~ \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    # The bootstrap is not content-hashed, so never let a stale copy survive
    # a deployment.
    location = /airi-bootstrap.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
