services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: 8789
      DATA_DIR: /data
      OPENCODE_TARGET: https://opencode.ai/inference/go/v1
    volumes:
      - airi-data:/data
    ports:
      - "127.0.0.1:8789:8789"
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

  tts:
    build:
      context: ./tts
      dockerfile: Dockerfile
    environment:
      PORT: 8790
      EDGE_TTS_VOICE: zh-CN-XiaoxiaoNeural
    ports:
      - "127.0.0.1:8790:8790"
    cpus: 0.25
    mem_limit: 192m
    restart: unless-stopped

  searxng:
    # SearXNG 2026.10.25
    image: searxng/searxng@sha256:23482d8ecf7ddf66029479468ea04c1bb11d2b65785a17a7e629e2ffd13296ca
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8792/
      SEARXNG_SECRET: local-browse-searxng-secret-0123456789abcdef
    volumes:
      - ./searxng:/etc/searxng:ro
    ports:
      - "127.0.0.1:8792:8080"
    networks:
      - browse-net
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

  browse:
    build:
      context: ./browse
      dockerfile: Dockerfile
    environment:
      PORT: 8791
      SEARXNG_URL: http://searxng:8080
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      - "127.0.0.1:8791:8791"
    networks:
      - browse-net
    cpus: 0.25
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8791), 2); s.close()"]
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    cpus: 0.5
    mem_limit: 128m
    restart: unless-stopped

volumes:
  airi-data:

networks:
  browse-net:
    driver: bridge
